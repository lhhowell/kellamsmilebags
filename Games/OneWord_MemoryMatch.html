<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OneWord Memory Match</title>
<style>
  :root{ --ink:#2B2D42; --teal:#2EC4B6; --teal-d:#1f9488; --cream:#FBF7F0; --amber:#FBB13C; --line:#E4DCCB; --red:#E5556E; }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(1200px 800px at 50% -10%,#eafaf8,var(--cream));
    color:var(--ink); min-height:100%; display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .wrap{width:min(760px,100%);background:#fff;border-radius:28px;padding:24px 24px 20px;box-shadow:0 24px 60px rgba(43,45,66,.14);text-align:center;}
  .eyebrow{letter-spacing:.28em;font-size:12px;font-weight:700;color:var(--teal-d);text-transform:uppercase;}
  h1{font-size:28px;margin:4px 0 2px;}
  .sub{color:#8a8f9c;font-size:14px;margin-bottom:12px;}
  .modes{display:inline-flex;background:var(--cream);border:2px solid var(--line);border-radius:14px;padding:4px;gap:4px;margin-bottom:14px;}
  .mode{font-family:inherit;font-size:14px;font-weight:700;border:none;background:transparent;color:#8a8f9c;padding:8px 14px;border-radius:10px;cursor:pointer;}
  .mode.active{background:var(--teal);color:#fff;}
  .stats{display:flex;justify-content:center;gap:20px;margin-bottom:14px;font-weight:700;color:var(--teal-d);flex-wrap:wrap;}
  .stats span b{color:var(--ink);font-size:20px;}
  .stats #time.low{color:var(--red);}
  .board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .tile{position:relative;aspect-ratio:3/4;cursor:pointer;perspective:700px;}
  .inner{position:absolute;inset:0;transition:transform .35s;transform-style:preserve-3d;}
  .tile.flip .inner,.tile.done .inner{transform:rotateY(180deg);}
  .face{position:absolute;inset:0;border-radius:14px;display:flex;align-items:center;justify-content:center;backface-visibility:hidden;font-weight:800;}
  .front{background:linear-gradient(160deg,var(--teal),var(--teal-d));color:#fff;font-size:26px;}
  .back{background:var(--cream);border:3px solid var(--line);transform:rotateY(180deg);padding:6px;text-align:center;}
  .back .emoji{font-size:min(10vw,40px);}
  .back .word{font-size:min(5vw,21px);color:var(--ink);letter-spacing:.02em;}
  .tile.done .back{border-color:var(--amber);background:#fff7e6;box-shadow:0 0 0 3px #ffe9a8 inset;}
  .tile.done{cursor:default;animation:pop .35s;}
  @keyframes pop{50%{transform:scale(1.06);}}
  .board.timeup{opacity:.55;}
  .btn{font-family:inherit;font-size:18px;font-weight:800;color:#fff;background:var(--teal);border:none;border-radius:14px;padding:13px 26px;cursor:pointer;margin-top:16px;box-shadow:0 6px 0 var(--teal-d);}
  .btn:active{transform:translateY(3px);box-shadow:0 3px 0 var(--teal-d);}
  .win{margin-top:12px;font-size:20px;font-weight:800;color:var(--teal-d);min-height:26px;}
  .foot{margin-top:14px;font-size:11px;letter-spacing:.12em;color:#b8b0a1;text-transform:uppercase;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">Smile Bags &middot; A Word &amp; Wonder Experience</div>
    <h1>OneWord Memory Match</h1>
    <div class="sub">Flip two cards &middot; match each OneWord to its picture &middot; clear all 8 pairs!</div>
    <div class="modes" id="modes">
      <button class="mode active" data-mode="clock">&#8987; Beat the Clock</button>
      <button class="mode" data-mode="stop">&#9201; Stopwatch</button>
    </div>
    <div class="stats">
      <span>Matches <b id="matches">0</b>/8</span>
      <span id="timeWrap"><b id="time">1:30</b></span>
      <span>Tries <b id="tries">0</b></span>
      <span>&#127942; <b id="best">&mdash;</b></span>
    </div>
    <div class="board" id="board"></div>
    <div class="win" id="win"></div>
    <button class="btn" id="new">New Game</button>
    <div class="foot">&copy; 2025&ndash;2026 Laura Howell &middot; Smile Bags</div>
  </div>
<script>
(function(){
  "use strict";
  var POOL = [
    {w:"BLOOM",e:"\uD83C\uDF38"},{w:"GROW",e:"\uD83C\uDF31"},{w:"SHINE",e:"\u2600\uFE0F"},{w:"FLOW",e:"\uD83C\uDF0A"},
    {w:"RISE",e:"\uD83C\uDF05"},{w:"ROOT",e:"\uD83C\uDF33"},{w:"HEAL",e:"\u2764\uFE0F\u200D\uD83E\uDE79"},{w:"CONNECT",e:"\uD83D\uDD17"},
    {w:"THRIVE",e:"\uD83C\uDF3F"},{w:"BREATHE",e:"\uD83C\uDF2C\uFE0F"}
  ];
  var PAIRS = 8;
  var COUNTDOWN_MS = 90000;     // beat-the-clock window
  var IDLE_RESET_MS = 120000;   // abandoned board reshuffles after 2 min
  var WIN_RESET_MS  = 7000;     // fresh board after a win
  var TIMEUP_RESET_MS = 4500;   // fresh board after time runs out
  var BEST_KEY = "ksb_match_best_v1";

  var board=document.getElementById("board"),
      elMatches=document.getElementById("matches"),
      elTries=document.getElementById("tries"),
      elTime=document.getElementById("time"),
      elBest=document.getElementById("best"),
      elWin=document.getElementById("win");

  var mode="clock";
  var deck=[], first=null, lock=false, matches=0, tries=0, prevKey="";
  var startMs=0, running=false, tickId=null, resetTimer=null, idleTimer=null;
  var best=null;
  try{ var bk=localStorage.getItem(BEST_KEY); if(bk) best=parseInt(bk,10); }catch(e){}
  renderBest();

  function fmt(ms){ if(ms<0)ms=0; var s=Math.round(ms/1000); return Math.floor(s/60)+":"+("0"+(s%60)).slice(-2); }
  function renderBest(){ elBest.textContent = (best && best>0) ? fmt(best) : "\u2014"; }
  function initialTime(){ return mode==="clock" ? fmt(COUNTDOWN_MS) : "0:00"; }
  function shuffle(a){ for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;} return a; }

  function chooseSubset(){
    var chosen, key, n=0;
    do{
      chosen = shuffle(POOL.slice()).slice(0,PAIRS);
      key = chosen.map(function(c){return c.w;}).sort().join("|");
      n++;
    } while(key===prevKey && n<14);
    prevKey = key;
    return chosen;
  }

  function startTimer(){
    if(running) return;
    running=true; startMs=Date.now();
    tickId=setInterval(tick, 250);
  }
  function tick(){
    var d = Date.now()-startMs;
    if(mode==="clock"){
      var rem = COUNTDOWN_MS - d;
      elTime.textContent = fmt(rem);
      elTime.classList.toggle("low", rem<=15000);
      if(rem<=0){ elTime.textContent="0:00"; timeUp(); }
    } else {
      elTime.textContent = fmt(d);
    }
  }
  function stopTimer(){ running=false; if(tickId){clearInterval(tickId);tickId=null;} }
  function bumpIdle(){ if(idleTimer)clearTimeout(idleTimer); idleTimer=setTimeout(newGame, IDLE_RESET_MS); }

  function newGame(){
    if(resetTimer){clearTimeout(resetTimer);resetTimer=null;}
    stopTimer();
    matches=0; tries=0; first=null; lock=false; startMs=0;
    elMatches.textContent="0"; elTries.textContent="0";
    elTime.textContent=initialTime(); elTime.classList.remove("low");
    elWin.textContent=""; board.classList.remove("timeup");
    var chosen = chooseSubset();
    deck=[];
    chosen.forEach(function(p,i){
      deck.push({id:i, kind:"word", label:p.w});
      deck.push({id:i, kind:"emoji", label:p.e});
    });
    shuffle(deck);
    board.innerHTML="";
    deck.forEach(function(c,idx){
      var tile=document.createElement("div"); tile.className="tile"; tile.dataset.idx=idx;
      var inner=document.createElement("div"); inner.className="inner";
      var front=document.createElement("div"); front.className="face front"; front.textContent="?";
      var back=document.createElement("div"); back.className="face back";
      back.innerHTML = (c.kind==="emoji") ? '<span class="emoji">'+c.label+'</span>' : '<span class="word">'+c.label+'</span>';
      inner.appendChild(front); inner.appendChild(back); tile.appendChild(inner);
      tile.addEventListener("click", function(){ flip(idx, tile); });
      board.appendChild(tile);
    });
    bumpIdle();
  }

  function flip(idx, tile){
    bumpIdle();
    if(lock) return;
    if(tile.classList.contains("flip")||tile.classList.contains("done")) return;
    if(!running && matches===0 && first===null) startTimer();
    tile.classList.add("flip");
    if(first===null){ first={idx:idx, tile:tile}; return; }
    if(first.idx===idx) return;
    tries++; elTries.textContent=tries;
    var a=deck[first.idx], b=deck[idx];
    if(a.id===b.id && a.kind!==b.kind){
      var t1=first.tile, t2=tile; first=null;
      setTimeout(function(){ t1.classList.add("done"); t2.classList.add("done"); }, 120);
      matches++; elMatches.textContent=matches;
      if(matches===PAIRS) win();
    } else {
      lock=true; var p1=first.tile, p2=tile; first=null;
      setTimeout(function(){ p1.classList.remove("flip"); p2.classList.remove("flip"); lock=false; }, 850);
    }
  }

  function win(){
    stopTimer();
    var elapsed = Date.now()-startMs;          // time actually used
    var msg = "\uD83C\uDF89 Cleared in "+fmt(elapsed)+" &middot; "+tries+" tries!";
    if(mode==="clock"){ msg = "\uD83C\uDF89 Beat the clock with "+fmt(COUNTDOWN_MS-elapsed)+" to spare!"; }
    if(!best || elapsed<best){ best=elapsed; renderBest(); try{localStorage.setItem(BEST_KEY,String(best));}catch(e){} msg += " \uD83C\uDFC6 New best!"; }
    elWin.innerHTML = msg;
    resetTimer=setTimeout(newGame, WIN_RESET_MS);
  }

  function timeUp(){
    stopTimer(); lock=true; board.classList.add("timeup");
    elWin.innerHTML = "\u23F0 Time&rsquo;s up! Reshuffling for the next builder\u2026";
    resetTimer=setTimeout(newGame, TIMEUP_RESET_MS);
  }

  document.getElementById("modes").addEventListener("click", function(e){
    var btn = e.target.closest(".mode"); if(!btn) return;
    var m = btn.dataset.mode; if(m===mode) return;
    mode=m;
    var btns=this.querySelectorAll(".mode");
    for(var i=0;i<btns.length;i++) btns[i].classList.toggle("active", btns[i]===btn);
    newGame();
  });
  document.getElementById("new").addEventListener("click", newGame);
  newGame();
})();
</script>
</body>
</html>
